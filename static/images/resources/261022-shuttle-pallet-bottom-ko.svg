<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="475" viewBox="0 0 1200 475" role="img" aria-labelledby="title desc">
  <title id="title">세 줄 받침형과 격자형 팔레트 하부</title>
  <desc id="desc">왼쪽은 세로 받침대 세 개, 오른쪽은 외곽 틀과 교차 받침대. 치수와 호환성을 뜻하지 않습니다.</desc>
  <style>
    text{font-family:'Arial','Noto Sans','Microsoft YaHei','Malgun Gothic',sans-serif;fill:#173650}
    .heading{font-size:28px;font-weight:700}
    .note{font-size:18px;fill:#5d788d}
    .frame{fill:#f1f7fb;stroke:#cadce8;stroke-width:2}
  </style>
  <rect width="1200" height="475" fill="#f8fafc"/>
  <rect class="frame" x="36" y="35" width="542" height="390" rx="22"/>
  <rect class="frame" x="622" y="35" width="542" height="390" rx="22"/>
  <text class="heading" x="307" y="89" text-anchor="middle">세 줄 받침형</text>
  <text class="heading" x="893" y="89" text-anchor="middle">격자형 하부</text>
  <rect x="118" y="124" width="378" height="225" rx="10" fill="#dcecf6" stroke="#a7c3d6" stroke-width="3"/>
  <rect x="145" y="143" width="54" height="187" rx="5" fill="#2477aa"/>
  <rect x="280" y="143" width="54" height="187" rx="5" fill="#2477aa"/>
  <rect x="415" y="143" width="54" height="187" rx="5" fill="#2477aa"/>
  <rect x="704" y="124" width="378" height="225" rx="10" fill="#dcecf6" stroke="#a7c3d6" stroke-width="3"/>
  <rect x="731" y="143" width="324" height="187" rx="5" fill="none" stroke="#2477aa" stroke-width="30"/>
  <rect x="871" y="143" width="44" height="187" fill="#2477aa"/>
  <rect x="731" y="214" width="324" height="44" fill="#2477aa"/>
  <text class="note" x="307" y="391" text-anchor="middle">세로 받침대 위치 확인</text>
  <text class="note" x="893" y="391" text-anchor="middle">개구부와 교차 받침대 확인</text>
  <text class="note" x="600" y="458" text-anchor="middle">구조 분류만 표시하며 특정 모델의 호환성을 뜻하지 않음</text>
</svg>
