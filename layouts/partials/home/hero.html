{{- $hero := .Params.home_hero -}}
{{- $image := index $hero.images 0 -}}
{{- $primary := $hero.primary_cta -}}
{{- $secondary := $hero.secondary_cta -}}

<section class="home-hero">
  <div class="container container--wide home-hero__inner">
    <div class="home-hero__content">
      <p class="home-hero__eyebrow">{{ $hero.eyebrow }}</p>
      <h1 class="home-hero__title">{{ $hero.title }}</h1>
      <p class="home-hero__text">{{ $hero.description }}</p>

      <div class="home-hero__actions">
        <a class="button" href="{{ partial "menu-url.html" (dict "url" $primary.url) }}">{{ $primary.label }}</a>
        <a class="button button--secondary" href="{{ partial "menu-url.html" (dict "url" $secondary.url) }}">{{ $secondary.label }}</a>
      </div>

    </div>

    {{ with $image }}
      <figure class="home-hero__media">
        {{ partial "responsive-image.html" (dict
          "src" .
          "alt" ""
          "class" "home-hero__image"
          "sizes" "(min-width: 64rem) 48vw, 92vw"
          "widths" (slice 640 960 1280 1600)
          "loading" "eager"
          "fetch" "high"
        ) }}
        {{ with $hero.visual_caption }}<figcaption class="home-hero__caption">{{ . }}</figcaption>{{ end }}
      </figure>
    {{ end }}
  </div>
</section>
